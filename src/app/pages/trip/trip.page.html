<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Trip Setup</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Origin (auto-detected)</ion-label>
    <ion-input [value]="origin" readonly></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Destination</ion-label>
    <ion-input [(ngModel)]="destination"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="startTrip()">Start Trip</ion-button>
</ion-content>
