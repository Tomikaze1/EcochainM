<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Vehicles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="vehicle-bg ion-padding">
  <div class="vehicle-options">
    <ion-button
      expand="block"
      shape="round"
      class="vehicle-btn"
      [color]="selectedVehicle === 'Van' ? 'success' : 'light'"
      (click)="selectVehicle('Van')"
    >Van</ion-button>

    <ion-button
      expand="block"
      shape="round"
      class="vehicle-btn"
      [color]="selectedVehicle === 'Refrigerated Van' ? 'success' : 'light'"
      (click)="selectVehicle('Refrigerated Van')"
    >Refrigerated Van</ion-button>

    <ion-button
      expand="block"
      shape="round"
      class="vehicle-btn"
      [color]="selectedVehicle === 'Motorcycle' ? 'success' : 'light'"
      (click)="selectVehicle('Motorcycle')"
    >Motorcycle</ion-button>

    <ion-button
      expand="block"
      shape="round"
      class="vehicle-btn"
      [color]="selectedVehicle === 'Pickup' ? 'success' : 'light'"
      (click)="selectVehicle('Pickup')"
    >Pickup</ion-button>

    <ion-button
      expand="block"
      shape="round"
      class="vehicle-btn"
      [color]="selectedVehicle === 'Scooter' ? 'success' : 'light'"
      (click)="selectVehicle('Scooter')"
    >Scooter</ion-button>

    <ion-button
      expand="block"
      shape="round"
      class="vehicle-btn"
      [color]="selectedVehicle === 'Truck' ? 'success' : 'light'"
      (click)="selectVehicle('Truck')"
    >Truck</ion-button>
  </div>

  <ion-button expand="block" shape="round" color="success" (click)="confirmVehicle()">Confirm</ion-button>
</ion-content>
